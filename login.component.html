<div class="login-wrapper">
    <form class="login-card" (ngSubmit)="login()">
        <h2>Connexion</h2>
        <p class="subtitle">Accédez à votre espace</p>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Mot de passe"
                required>
        </div>

        <button type="submit">Se connecter</button>

        <div class="register-link">
            <a routerLink="/register">Créer un compte</a>
        </div>
    </form>
</div>
