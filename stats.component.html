<section class="stats">
  <h2>Statistiques</h2>

  <!-- Cartes -->
  <div class="stat-cards">
    <div class="stat green">
      <span>{{ studentsCount }}</span>
      <p>Étudiants</p>
    </div>

    <div class="stat blue">
      <span>{{ filieresCount }}</span>
      <p>Filières</p>
    </div>
  </div>

  <!-- Graphiques -->
  <div class="charts">
    <div class="chart">
      <h3>Répartition</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="chart">
      <h3>Comparaison</h3>
      <canvas id="barChart"></canvas>
    </div>
  </div>
</section>
