<section class="section">
  <header class="section-header">
    <h2>Étudiants</h2>
  </header>

  <!-- Formulaire d'ajout -->
  <div class="form-row">
    <input type="text" [(ngModel)]="name" placeholder="Nom">
    <input type="text" [(ngModel)]="filiere" placeholder="Filière">
    <button (click)="addStudent()">Ajouter</button>
  </div>

  <p class="message" style="color: red">{{ message }}</p>

  <!-- Liste des étudiants -->
  <ul class="list">
    <li *ngFor="let student of students">
      <!-- Affichage classique -->
      <span *ngIf="!student.editing">{{ student.name }} — {{ student.filiere }}</span>

      <!-- Formulaire inline pour modification -->
      <span *ngIf="student.editing">
        <input [(ngModel)]="student.name" placeholder="Nom">
        <input [(ngModel)]="student.filiere" placeholder="Filière">
      </span>

      <div class="buttons">
        <button *ngIf="!student.editing" (click)="startEdit(student)">Modifier</button>
        <button *ngIf="student.editing" (click)="updateStudent(student)">Enregistrer</button>
        <button class="danger" (click)="deleteStudent(student.id)">Supprimer</button>
      </div>
    </li>
  </ul>
</section>
